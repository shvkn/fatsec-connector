services:
  ydb:
    image: ydbplatform/local-ydb:latest
    platform: linux/amd64
    hostname: ydb
    environment:
      GRPC_PORT: "2136"
      MON_PORT: "8765"
    ports:
      - "2136:2136"
      - "8765:8765"
    volumes:
      - fatsecret_ydb:/ydb_data

  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      ydb:
        condition: service_healthy
    environment:
      YDB_CONNECTION_STRING: grpc://ydb:2136/local
      YDB_AUTH_MODE: anonymous

volumes:
  fatsecret_ydb:
